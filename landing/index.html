<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recharge | Coming soon</title>
  <meta name="description" content="Recharge Group. Coming soon.">
  <meta name="theme-color" content="#EFE7DA">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:title" content="Recharge">
  <meta property="og:description" content="Coming soon.">
  <meta property="og:image" content="https://rechargegroup.co.uk/og.png">
  <meta property="og:url" content="https://rechargegroup.co.uk">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root { --green: #263F3B; --bone: #EFE7DA; }
    * { box-sizing: border-box; margin: 0; }
    html, body, #root { height: 100%; }
    #root { position: fixed; inset: 0; }
    body {
      min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--bone);
      color: var(--green); font-family: Montserrat, system-ui, sans-serif; padding: 32px 20px; text-align: center;
    }
    main { display: flex; flex-direction: column; align-items: center; gap: clamp(24px, 4vw, 40px); width: 100%; }
    h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    #fallback img { width: min(640px, 86vw); height: auto; animation: rise 900ms cubic-bezier(.2,.7,.2,1) both; }
    #fallback p { font-size: clamp(13px, 1.6vw, 16px); font-weight: 600; letter-spacing: .42em; text-transform: uppercase; opacity: .85; padding-left: .42em; animation: rise 900ms 180ms cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { #fallback img, #fallback p { animation: none; } }
  </style>
</head>
<body>
  <h1>Recharge</h1>
  <div id="root"></div>
  <main id="fallback">
    <img src="/logo.png" width="1818" height="346" alt="Recharge">
    <p>Coming soon</p>
  </main>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
