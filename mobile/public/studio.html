<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recharge mobile studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1ed;color:#173c31;font-family:Arial,sans-serif}header{height:76px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d9e0d9;background:#fff}header strong{font-size:23px;letter-spacing:-.6px}header a{font-size:14px;color:#234f40;text-decoration:none;padding:14px 18px;border:1px solid #d9e0d9;border-radius:14px}main{height:calc(100dvh - 76px);display:flex;align-items:center;justify-content:center;gap:70px;padding:24px}.intro{max-width:310px}.label{font-size:12px;letter-spacing:1.2px;color:#536a5e}h1{font-size:40px;line-height:1.12;letter-spacing:-1.5px;margin:16px 0}p{font-size:16px;line-height:1.7;color:#53655d}.note{font-size:13px}.frame-space{width:calc(414px * var(--scale,1));height:calc(834px * var(--scale,1));flex-shrink:0}.phone{transform:scale(var(--scale,1));transform-origin:top left;width:414px;height:834px;border-radius:54px;background:#13251e;padding:10px;border:2px solid #5e7268;box-shadow:0 24px 60px #183d3129,0 4px 10px #183d3114}.screen{height:100%;overflow:hidden;border-radius:42px;background:#fff;display:flex;flex-direction:column}.status{height:30px;flex-shrink:0;background:#fff;color:#172e29;display:flex;align-items:center;justify-content:space-between;padding:0 23px;font-size:12px;font-weight:bold}.camera{width:80px;height:19px;background:#14261f;border-radius:15px}.battery{border:1px solid #172e29;border-radius:3px;width:20px;height:9px;position:relative}.battery:before{content:'';position:absolute;inset:2px;background:#172e29}.battery:after{content:'';position:absolute;right:-3px;top:2px;width:2px;height:3px;background:#172e29}iframe{border:0;flex:1;width:100%;background:#fff}.home-indicator{height:18px;flex-shrink:0;background:#fff;display:flex;align-items:center;justify-content:center}.home-indicator:after{content:'';height:4px;width:108px;border-radius:8px;background:#172e29}@media(max-width:820px){main{gap:0}.intro{display:none}header{padding:0 20px}}
</style></head>
<body><header><strong>Recharge</strong><a href="/home" target="_blank" rel="noopener">Open full view</a></header><main><div class="intro"><span class="label">MOBILE STUDIO</span><h1>Your workspace.<br>In your hand.</h1><p>Explore the redesigned app, browse your departments and export reports from an admin view.</p><p class="note">Interactive browser preview<br>Sample data. No simulator minutes used.</p></div><div class="frame-space"><div class="phone"><div class="screen"><div class="status"><span>9:41</span><span class="camera" aria-hidden="true"></span><span class="battery" aria-hidden="true"></span></div><iframe src="/home" title="Recharge interactive mobile app"></iframe><div class="home-indicator" aria-hidden="true"></div></div></div></div></main>
<script>function fit(){const main=document.querySelector('main');const width=innerWidth>820?innerWidth-480:innerWidth-32;const scale=Math.min(1,width/414,(main.clientHeight-48)/834);document.documentElement.style.setProperty('--scale',Math.max(.25,scale))}addEventListener('resize',fit);fit();</script>
</body></html>
